name: Deploy containerized API
on: 
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da rilasciare (es. 1.0.X) - la X viene incrementata automaticamente"
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest

        # Variabili riutilizzate nei vari step
    env:
      VERSION:        ${{ github.event.inputs.version }}

    steps:
      # Scarica il tuo codice nel runner
      - name: Checkout del codice
        uses: actions/checkout@v4 

      # Scrivi sul terminale
      - name: Esegui uno script
        run: echo "Pushando il container"

      # Configura QEMU e Docker Buildx per il multi-architettura
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # loggati su docker hub
      - name: Login su Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # Costruisci e push del container
      - name: Build e Push con Versionamento
        uses: docker/build-push-action@v5
        with:
          context: ./src # Cerca il Dockerfile partendo da src, per includere anche /Plugins/Plugins.Shared.csproj
          file: ./src/GestioLan.API/Dockerfile # Percorso relativo del Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64 # Specifica le piattaforme
          # Qui gestiamo le versioni
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gestiolan-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gestiolan-api:v${{ env.VERSION }}.${{ github.run_number }}