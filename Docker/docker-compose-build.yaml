services:
  db:
    build:
      context: ../database
      dockerfile: Dockerfile
    container_name: GestioLan.Database
    command: 
      - "--log-bin=mysql-bin"
      - "--expire-logs-days=2"  # Cancella i log binari vecchi di 2 giorni
      - "--max-binlog-size=100M" # Non creare file binari più grandi di 100MB
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      # Per permettere connessioni da qualsiasi host, ma in produzione dovremo limitare questo
      - MARIADB_USER_HOST=%
    volumes:
      - type: bind
        source: ${RESOURCE_DEST_PATH}/test_builds/gestiolan-mysql
        target: /var/lib/mysql
        # bind:
          # create_host_path: false
    networks: 
      - gestionale_network # Nome del network per api e db
    healthcheck: # Per verificare che il database sia pronto prima di avviare l'API
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 20

  api:
    build:
      context: ../src/GestioLan.API
      dockerfile: Dockerfile
    container_name: GestioLan.API_TEST
    ports:
      - "5169:8080"
    environment:
      # Nota: Server=GestioLan-Database usa il nome del servizio definito sopra
      - Storage__UsersPath=${Storage__UsersPath}
      - Storage__ItemsPath=${Storage__ItemsPath}
      - Storage__LogsPath=${Storage__LogsPath}
      - Storage__PluginsPath=${Storage__PluginsPath}

      - JwtSettings__Key=${JwtSettings__Key}
      - Metadata__ApiOverrideMetadata=${Metadata__ApiOverrideMetadata}

      - ConnectionStrings__GestioLANConnection=Server=GestioLan.Database;Port=3306;Database=${DB_NAME};User Id=${DB_USERNAME};Password=${DB_PASSWORD};SslMode=none;
      - ConnectionStrings__seq=${ConnectionStrings__seq} # se sono entrambi nella stessa rete docker ,allora http://{nome_servizio}:{porta}

      - ASPNETCORE_ENVIRONMENT=Development # Per ora teniamo Development per vedere gli errori
    volumes:
      - type: bind
        source: ${RESOURCE_DEST_PATH}/test_builds/uploads/users
        target: /app/data/uploads/users
        # bind:
          # create_host_path: false
      - type: bind
        source: ${RESOURCE_DEST_PATH}/test_builds/uploads/items
        target: /app/data/uploads/items
        # bind:
          # create_host_path: false
      - type: bind
        source: ${RESOURCE_DEST_PATH}/test_builds/logs
        target: /app/logs
        # bind:
          # create_host_path: false
    networks: 
      - gestionale_network # Nome del network per api e db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # Massimo 10 Megabyte per file
        max-file: "3"     # Tiene al massimo 3 file (totale 30MB)
    depends_on: # Per assicurarsi che il database sia avviato prima dell'API
      db:
        condition: service_healthy
    
  seq:
    image: datalust/seq:latest
    container_name: GestioLan.Logs
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_FIRSTRUN_ADMINPASSWORD}
    ports:
      - "5341:80"   # interfaccia web → http://localhost:5341
    volumes:
      - ${RESOURCE_DEST_PATH}/seq_data:/data
    networks: 
      - gestionale_network 

networks: 
  gestionale_network: 
    # external: true 
