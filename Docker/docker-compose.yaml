services:
  db:
    image: ${DOCKER_USER}/${DATABASE_IMAGE_NAME}:latest
    container_name: GestioLan.Database
    command: 
      - "--log-bin=mysql-bin"
      - "--expire-logs-days=2"  # Cancella i log binari vecchi di 2 giorni
      - "--max-binlog-size=100M" # Non creare file binari più grandi di 100MB
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      # Per permettere connessioni da qualsiasi host, ma in produzione dovremo limitare questo
      - MARIADB_USER_HOST=%
    volumes:
      - type: bind
        source: ${RESOURCE_DEST_PATH}/gestiolan-mysql
        target: /var/lib/mysql
        # bind:
          # create_host_path: false
    networks:
      - gestionale_network
    healthcheck: # Per verificare che il database sia pronto prima di avviare l'API
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 20

  api:
    image: ${DOCKER_USER}/${API_IMAGE_NAME}:latest
    container_name: GestioLan.API
    restart: always
    ports:
      - "5169:8080"
    environment:
      # Nota: Server=GestioLan-Database usa il nome del servizio definito sopra
      - Storage__UsersPath=${PATH_USERS}
      - Storage__ItemsPath=${PATH_ITEMS}
      - JwtSettings__Key=${JWT_KEY}
      - ConnectionStrings__GestioLANConnection=Server=GestioLan.Database;Port=3306;Database=${DB_NAME};User Id=${DB_USERNAME};Password=${DB_PASSWORD};SslMode=none;
      - ASPNETCORE_ENVIRONMENT=Development # Per ora teniamo Development per vedere gli errori
    volumes:
      - type: bind
        source: ${RESOURCE_DEST_PATH}/uploads/users
        target: /app/data/uploads/users
        # bind:
          # create_host_path: false
      - type: bind
        source: ${RESOURCE_DEST_PATH}/uploads/items
        target: /app/data/uploads/items
        # bind:
          # create_host_path: false
      - type: bind
        source: ${RESOURCE_DEST_PATH}/logs
        target: /app/logs
        # bind:
          # create_host_path: false
    networks: 
      - gestionale_network # Nome del network per api e db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # Massimo 10 Megabyte per file
        max-file: "3"     # Tiene al massimo 3 file (totale 30MB)
    depends_on: # Per assicurarsi che il database sia avviato prima dell'API
      db:
        condition: service_healthy

networks: 
  gestionale_network: 
    # external: true 
