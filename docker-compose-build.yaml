services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: GestioLAN-DB_TEST
    ports:
      - "3306:3306"
    environment:
      - DB_ROOT_PASSWORD="${DB_ROOT_PASSWORD}"
      - DB_NAME="${DB_NAME}"
      - DB_USERNAME="${DB_USERNAME}"
      - DB_PASSWORD="${DB_PASSWORD}"
      - DB_PORT="${DB_PORT}"
    networks: 
      - gestionale_network # Nome del network per api e db

  api:
    build:
      context: .
      dockerfile: src/csharpAPI/Dockerfile
    container_name: GestioLAN-API_TEST
    ports:
      - "5169:8080"
    environment:
      - JWT-Settings__key=${JWT-Key}
      - ConnectionStrings__GestioLANConnection=Server=mariadb11;Port=3306;Database=${DB_NAME};User Id=${DB_USERNAME};Password=${DB_PASSWORD};SslMode=none;
      - ASPNETCORE_ENVIRONMENT=Development # Per ora teniamo Development per vedere gli errori
    networks: 
      - gestionale_network # Nome del network per api e db

networks: 
  gestionale_network: 
    external: true 
